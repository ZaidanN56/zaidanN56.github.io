            height: 100%; 
            object-fit: cover;

            margin-bottom: 5px;

            margin-top: 20px;

            background-color: #e0e0e0;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 14px;
